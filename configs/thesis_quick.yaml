project_name: HGE Gold Forecasting Thesis V2

data:
  source: sample
  csv_path: null
  min_rows: 700
  decision_hour_utc: 22

features:
  return_lags: [1, 2, 3, 5, 10, 20]
  windows: [5, 10, 20, 63, 126]
  hurst_windows: [64, 128]
  regime_window: 252
  min_feature_coverage: 0.70

targets:
  horizons: [1, 5, 10, 20]
  volatility_window: 63
  volatility_min_periods: 40
  threshold_k: 0.35
  threshold_floor_bps: 8.0
  transaction_cost_bps: 3.0
  slippage_bps: 2.0

splits:
  locked_test_fraction: 0.20
  n_walk_forward_folds: 4
  min_train_rows: 280
  min_validation_rows: 45

models:
  random_seed: 42
  fast_mode: true
  probability_threshold_min: 0.35
  probability_threshold_max: 0.65
  probability_threshold_steps: 61
  gate_tolerance: 0.005

evaluation:
  primary_metric: balanced_accuracy
  primary_threshold: 0.60
  macro_f1_threshold: 0.55
  minimum_class_recall: 0.50
  min_test_samples: 80
  bootstrap_iterations: 40
  bootstrap_block_length: 10

outputs:
  artifact_dir: artifacts/v2
  model_dir: models/v2
  prediction_dir: data/predictions/v2
