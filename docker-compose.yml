services:
  api:
    build: .
    environment:
      HGE_TRADING_MODE: offline
      HGE_DATA_DIR: /app/data
      HGE_ARTIFACT_DIR: /app/artifacts
      HGE_MODEL_DIR: /app/models
    ports:
      - "8000:8000"
    volumes:
      - hge_data:/app/data
      - hge_artifacts:/app/artifacts
      - hge_models:/app/models
    restart: unless-stopped
volumes:
  hge_data:
  hge_artifacts:
  hge_models:

