[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hge-hybrid-gold"
version = "0.1.0"
description = "Leakage-safe, audit-first multi-horizon gold forecasting research pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.3.5",
  "pandas==2.2.3",
  "pyyaml==6.0.3",
  "scikit-learn==1.8.0",
  "typer==0.16.1",
]

[project.optional-dependencies]
dev = [
  "bandit==1.8.6",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]
mt5 = [
  "MetaTrader5==5.0.6090; platform_system == 'Windows'",
]

[project.scripts]
hge-gold = "hge_gold.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hge_gold"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["hge_gold"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["hge_gold"]
branch = true
